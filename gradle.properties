# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
forge_version=47.2.0
parchment_version=2023.09.03-1.20.1

mod_id=compactcrafting

# Dependencies and Libs
jei_mc_version=1.20.1
jei_version=15.2.0.27

# Curseforge
#cf_project=429735
#cf_release_type=beta

# TLS protocol configuration
systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
systemProp.http.protocols=HTTP/1.1

# Disable SSL certificate verification (temporary solution)
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
systemProp.net.minecraftforge.gradle.check.certs=false
